<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Barcode</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6f8;
            color: #2a3f54;
            font-size: 14px;
            display: flex;
            justify-content: center;
            padding: 32px 20px 60px;
        }
        .app {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .controls {
            background: #fff;
            border: 1px solid #e6eaee;
            border-radius: 8px;
            padding: 16px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
        }
        .controls .full { grid-column: 1 / -1; }
        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #6b7a89;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        input[type="text"], select {
            padding: 9px 12px;
            border: 1px solid #c9d1d9;
            border-radius: 4px;
            font-size: 14px;
            color: #2a3f54;
            background: #fff;
            font-family: inherit;
            font-weight: 400;
            text-transform: none;
            letter-spacing: normal;
        }
        input[type="text"] {
            font-family: "Courier New", monospace;
            letter-spacing: 2px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4a5d3a;
            box-shadow: 0 0 0 3px rgba(74,93,58,0.15);
        }
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238a99a8' d='M6 8L0 0h12z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 34px;
        }
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-wrap input[type="range"] {
            flex: 1;
            accent-color: #4a5d3a;
        }
        .slider-wrap .val {
            min-width: 28px;
            text-align: right;
            font-family: "Courier New", monospace;
            font-size: 14px;
            font-weight: 600;
            color: #2a3f54;
            text-transform: none;
            letter-spacing: normal;
        }

        .stage {
            background: #fff;
            border: 1px solid #e6eaee;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }
        .stage svg {
            width: 100%;
            height: auto;
            max-width: 520px;
        }
        .err {
            color: #b33;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="app">
        <h1>SVG Barcode</h1>

        <div class="controls">
            <label class="full">Codice EAN-13
                <input type="text" id="code" value="8032089230001" maxlength="13" inputmode="numeric" pattern="[0-9]*">
            </label>
            <label>Forma
                <select id="shape">
                    <option value="heart">Cuore</option>
                    <option value="horse">Cavallo</option>
                    <option value="star">Stella</option>
                    <option value="circle">Cerchio</option>
                    <option value="diamond">Rombo</option>
                    <option value="butterfly">Farfalla</option>
                    <option value="square">Rettangolo</option>
                </select>
            </label>
            <label>Ripetizioni
                <span class="slider-wrap">
                    <input type="range" id="rep" min="1" max="10" value="3">
                    <span class="val" id="rep-val">3</span>
                </span>
            </label>
        </div>

        <div class="stage" id="stage"></div>
    </main>

    <script>
    (function () {
        const codeEl  = document.getElementById('code');
        const shapeEl = document.getElementById('shape');
        const repEl   = document.getElementById('rep');
        const repVal  = document.getElementById('rep-val');
        const stage   = document.getElementById('stage');

        const BAR_COLOR = '#4a5d3a';

        // --- shapes (all authored in a 500 x 460 canvas) ---
        const SHAPES = {
            heart: {
                path: 'M250,430 C 40,300 0,180 80,100 C 140,40 230,60 250,150 C 270,60 360,40 420,100 C 500,180 460,300 250,430 Z'
            },
            // Stylised galloping horse silhouette
            horse: {
                path: 'M60,380 L60,340 L100,340 L120,300 L100,270 L120,240 L110,200 L130,170 L160,160 L175,120 L200,100 L225,90 L245,70 L270,60 L300,65 L325,80 L345,110 L360,140 L380,150 L410,155 L440,170 L455,200 L450,230 L430,250 L410,265 L405,290 L415,320 L435,340 L455,360 L455,380 L410,380 L410,355 L380,355 L380,380 L330,380 L330,345 L300,320 L260,320 L240,345 L240,380 L200,380 L200,355 L175,355 L175,380 L130,380 L130,350 L110,350 L110,380 Z'
            },
            star: {
                path: 'M250,30 L310,190 L480,190 L345,290 L400,460 L250,360 L100,460 L155,290 L20,190 L190,190 Z'
            },
            circle: {
                path: 'M250,20 A210,210 0 1,0 250,440 A210,210 0 1,0 250,20 Z'
            },
            diamond: {
                path: 'M250,20 L480,230 L250,440 L20,230 Z'
            },
            butterfly: {
                path: 'M250,230 C 100,40 20,140 50,300 C 80,430 200,430 250,290 C 300,430 420,430 450,300 C 480,140 400,40 250,230 Z'
            },
            square: {
                path: 'M10,10 L490,10 L490,450 L10,450 Z'
            }
        };

        // --- EAN-13 helpers ---
        function ean13CheckDigit(first12) {
            const d = first12.split('').map(Number);
            let sum = 0;
            for (let i = 0; i < 12; i++) sum += d[i] * (i % 2 === 0 ? 1 : 3);
            return ((10 - (sum % 10)) % 10).toString();
        }

        function normalizeCode(raw) {
            const digits = (raw || '').replace(/\D/g, '');
            if (digits.length === 13) return digits;
            if (digits.length === 12) return digits + ean13CheckDigit(digits);
            return null;
        }

        // Use JsBarcode to generate the bar pattern, then keep only the dark bars
        // with x normalised to start at 0.
        function generateBars(code) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const tmp = document.createElementNS(svgNS, 'svg');
            try {
                JsBarcode(tmp, code, {
                    format: 'EAN13',
                    displayValue: false,
                    margin: 0,
                    width: 2,
                    height: 100,
                    background: 'transparent',
                    lineColor: '#000'
                });
            } catch (e) { return null; }

            const rects = Array.from(tmp.querySelectorAll('rect'));
            if (!rects.length) return null;

            // Drop the widest rect (background).
            let bgIdx = 0;
            rects.forEach((r, i) => {
                const w = parseFloat(r.getAttribute('width')) || 0;
                const bgW = parseFloat(rects[bgIdx].getAttribute('width')) || 0;
                if (w > bgW) bgIdx = i;
            });
            const bars = rects
                .filter((_, i) => i !== bgIdx)
                .map(r => ({
                    x: parseFloat(r.getAttribute('x')) || 0,
                    w: parseFloat(r.getAttribute('width')) || 0
                }))
                .filter(b => b.w > 0);
            if (!bars.length) return null;

            let minX = Infinity, maxX = -Infinity;
            bars.forEach(b => {
                if (b.x < minX) minX = b.x;
                if (b.x + b.w > maxX) maxX = b.x + b.w;
            });
            return {
                bars: bars.map(b => ({ x: b.x - minX, w: b.w })),
                totalW: maxX - minX
            };
        }

        // Build the final SVG: shape on top (bars tiled N times, clipped),
        // standard barcode strip + digits below — like the horse reference.
        function buildSvg(code, shapeKey, rep) {
            const data = generateBars(code);
            if (!data) return '<div class="err">Codice non valido</div>';
            const { bars, totalW } = data;
            const shape = SHAPES[shapeKey];

            const VB_W      = 500;
            const SHAPE_H   = 460;
            const GAP       = 14;
            const STRIP_H   = 90;
            const TEXT_BAND = 34;
            const TOTAL_H   = SHAPE_H + GAP + STRIP_H + TEXT_BAND;

            const clipId = 'clip-' + Math.random().toString(36).slice(2, 8);

            let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VB_W} ${TOTAL_H}" role="img" aria-label="Barcode ${code}">`;
            s += `<defs><clipPath id="${clipId}"><path d="${shape.path}"/></clipPath></defs>`;

            // --- Shape (bars tiled `rep` times, clipped) ---
            const unitW = VB_W / rep;
            const scale = unitW / totalW;
            s += `<g clip-path="url(#${clipId})">`;
            for (let i = 0; i < rep; i++) {
                const offX = i * unitW;
                for (let j = 0; j < bars.length; j++) {
                    const b = bars[j];
                    const x = offX + b.x * scale;
                    const w = b.w * scale;
                    s += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${SHAPE_H}" fill="${BAR_COLOR}"/>`;
                }
            }
            s += `</g>`;

            // --- Standard barcode strip ---
            const stripY = SHAPE_H + GAP;
            const stripScale = VB_W / totalW;
            bars.forEach(b => {
                const x = b.x * stripScale;
                const w = b.w * stripScale;
                s += `<rect x="${x.toFixed(2)}" y="${stripY}" width="${w.toFixed(2)}" height="${STRIP_H}" fill="${BAR_COLOR}"/>`;
            });

            // --- Readable digits ---
            s += `<text x="${VB_W/2}" y="${stripY + STRIP_H + TEXT_BAND - 10}" text-anchor="middle" font-family="Courier New, monospace" font-size="24" fill="#2a3f54" letter-spacing="4">${code}</text>`;

            s += `</svg>`;
            return s;
        }

        function render() {
            const code = normalizeCode(codeEl.value);
            repVal.textContent = repEl.value;
            if (!code) {
                stage.innerHTML = '<div class="err">Inserisci 12 o 13 cifre.</div>';
                return;
            }
            stage.innerHTML = buildSvg(code, shapeEl.value, parseInt(repEl.value, 10));
        }

        [codeEl, shapeEl, repEl].forEach(el => {
            el.addEventListener('input', render);
            el.addEventListener('change', render);
        });

        render();
    })();
    </script>
</body>
</html>
